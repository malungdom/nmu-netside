
on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a manual "Run workflow" button

concurrency:
  group: deploy
  cancel-in-progress: true  # a newer push supersedes an older deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: pip install lektor
      - run: lektor build --output-path dist/

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload site
        run: rsync -avz --delete dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:./"